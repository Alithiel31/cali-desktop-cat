name: Release

on:
  push:
    tags: ["v*"]          # publication : git tag v0.3.0 && git push --tags
  pull_request:           # build à blanc quand le code ou le packaging change
    paths:
      - "main.py"
      - "requirements.txt"
      - "desktopcat/**"
      - "assets/**"
      - "tools/make_version_file.py"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build DesktopCat.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Le tag doit correspondre à desktopcat.__version__ (ex. tag v0.3.0 <-> "0.3.0")
      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $code = (python -c "import desktopcat; print(desktopcat.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($code -ne $tag) {
            Write-Error "Le tag '${{ github.ref_name }}' ne correspond pas à __version__ = '$code'."
            exit 1
          }

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests avant de packager
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Métadonnées de l'exécutable (nom, version)
        run: python tools/make_version_file.py

      - name: Construire l'exécutable
        run: >-
          pyinstaller --noconsole --onefile --name DesktopCat --icon assets/desktopcat.ico
          --version-file build/version_info.txt main.py

      # ───── Signature (SignPath Foundation) : à activer une fois le projet accepté.
      # Secrets à créer dans le dépôt : SIGNPATH_API_TOKEN, et en variables : SIGNPATH_ORGANIZATION_ID.
      # Le flux : l'exe non signé part en artefact, SignPath le récupère, l'approbateur valide sur signpath.io,
      # l'exe signé revient et remplace dist/DesktopCat.exe avant l'empreinte. Vérifier les noms exacts
      # (projet, politique, version de l'action) dans la documentation SignPath au moment de l'activer.
      #
      # - id: unsigned
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: DesktopCat-unsigned
      #     path: dist/DesktopCat.exe
      #
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: desktop-cat
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist

      - name: Empreinte SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DesktopCat.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DesktopCat.exe" | Out-File dist/DesktopCat.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: DesktopCat-windows
          path: |
            dist/DesktopCat.exe
            dist/DesktopCat.exe.sha256
          if-no-files-found: error

  publish:
    name: Publier la Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # seul ce job peut créer la Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DesktopCat-windows

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DesktopCat.exe DesktopCat.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Desktop Cat $GITHUB_REF_NAME" \
            --generate-notes
