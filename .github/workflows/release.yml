name: Release

on:
  push:
    tags: ["v*"]          # publication : git tag v0.3.0 && git push --tags
  pull_request:           # build à blanc quand le code ou le packaging change
    paths:
      - "main.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "DesktopCat.spec"
      - "desktopcat/**"
      - "assets/**"
      - "tools/make_version_file.py"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build DesktopCat.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      # Le tag doit correspondre à desktopcat.__version__ (ex. tag v0.3.0 <-> "0.3.0")
      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $code = (python -c "import desktopcat; print(desktopcat.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($code -ne $tag) {
            Write-Error "Le tag '${{ github.ref_name }}' ne correspond pas à __version__ = '$code'."
            exit 1
          }

      - name: Installer les dépendances
        run: python -m pip install -r requirements-build.txt

      - name: Tests avant de packager
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Métadonnées de l'exécutable (nom, version)
        run: python tools/make_version_file.py

      - name: Construire l'exécutable
        run: >-
          pyinstaller DesktopCat.spec

      - name: Empreinte SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DesktopCat.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DesktopCat.exe" | Out-File dist/DesktopCat.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: DesktopCat-windows
          path: |
            dist/DesktopCat.exe
            dist/DesktopCat.exe.sha256
          if-no-files-found: error

  publish:
    name: Publier la Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # seul ce job peut créer la Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DesktopCat-windows

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DesktopCat.exe DesktopCat.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Desktop Cat $GITHUB_REF_NAME" \
            --generate-notes
