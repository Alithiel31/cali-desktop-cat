name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Bibliothèques système dont Qt a besoin pour se charger en mode offscreen
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          # Diagnostic : faulthandler affiche où Python meurt en cas de plantage, et on lit le code de sortie de Python lui-même.
          python -X faulthandler -m unittest discover -s tests -v && code=0 || code=$?
          echo "Code de sortie de Python : $code"
          exit $code
